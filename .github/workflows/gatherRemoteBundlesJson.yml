name: Gather Bundle JSON for all core modules we ship along

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout jasp-desktop
        uses: actions/checkout@v5
        with:
          path:  'jasp-desktop'

      - name: Checkout secondary repo
        uses: actions/checkout@v5
        with:
          repository: jasp-stats-modules/modules-registry
          path:  'module-registry'

      - name: Run script
        run: ls -l

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub
          pip install argparse

      - name: Run script
        run: python Tools/gatherModuleJson.py 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add Modules/remote-bundles.json
          git commit -m "Update Bundles"

      - name: Push changes
        run: git push
